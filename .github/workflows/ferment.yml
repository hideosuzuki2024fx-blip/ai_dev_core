name: Yoshio Auto-Ferment

on:
  schedule:
    - cron: "0 3 * * *"  # JST 12:00（毎日発酵）
  workflow_dispatch:

jobs:
  ferment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SKIP_INTEGRITY: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v2

      - name: Run Ferment Pipeline
        run: pwsh ./scripts/FermentPipeline.ps1

      - name: Update Manifest
        run: pwsh ./scripts/update_manifest_with_logging.ps1

      - name: Commit & Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: auto-ferment $(date +'%Y%m%d_%H%M%S')"
          git push
